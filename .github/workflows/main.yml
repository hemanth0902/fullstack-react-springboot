
name: Secure Deploy - DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------
  # 1. BUILD, TEST AND SECRET SCANNING
  # --------------------------------------------------
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test Spring Boot backend
        working-directory: backend
        run: mvn -B clean verify

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------
  # 2. SONARQUBE ANALYSIS
  # --------------------------------------------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: [self-hosted, Windows, X64]
    needs: [build]

    # Local SonarQube runner is not used for pull requests.
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify local SonarQube
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:9000/api/system/status" `
            -UseBasicParsing

          $status = $response.Content | ConvertFrom-Json

          if ($status.status -ne "UP") {
            throw "SonarQube is not UP."
          }

          Write-Host "Local SonarQube is reachable and UP."

      - name: Analyze Spring Boot backend
        working-directory: backend
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN is missing from GitHub Actions secrets."
          }

          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar `
            "-Dsonar.projectKey=Secure-Deploy-Backend" `
            "-Dsonar.projectName=Secure Deploy Backend" `
            "-Dsonar.host.url=http://localhost:9000" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true"

          if ($LASTEXITCODE -ne 0) {
            throw "Backend build or SonarQube analysis failed."
          }

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: npm.cmd ci

      - name: Verify SonarScanner CLI
        shell: powershell
        run: |
          $scanner = "C:\Tools\sonar-scanner-8.1.0.6389-windows-x64\bin\sonar-scanner.bat"

          if (-not (Test-Path $scanner)) {
            throw "SonarScanner CLI was not found at $scanner"
          }

          & $scanner --version

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner CLI version check failed."
          }

      - name: Analyze React frontend
        working-directory: frontend
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SONAR_TOKEN)) {
            throw "SONAR_TOKEN is missing from GitHub Actions secrets."
          }

          $scanner = "C:\Tools\sonar-scanner-8.1.0.6389-windows-x64\bin\sonar-scanner.bat"

          if (-not (Test-Path $scanner)) {
            throw "SonarScanner CLI was not found at $scanner"
          }

          & $scanner `
            "-Dsonar.projectKey=Secure-Deploy-Frontend" `
            "-Dsonar.projectName=Secure Deploy Frontend" `
            "-Dsonar.sources=src" `
            "-Dsonar.exclusions=node_modules/**,dist/**" `
            "-Dsonar.sourceEncoding=UTF-8" `
            "-Dsonar.host.url=http://localhost:9000" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=true"

          if ($LASTEXITCODE -ne 0) {
            throw "Frontend SonarQube analysis failed."
          }

  # --------------------------------------------------
  # 3. DEPENDENCY VULNERABILITY SCANNING
  # --------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY secret is missing."
            exit 1
          fi

          echo "NVD API key is configured."

      - name: Scan Java dependencies with OWASP
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B -ntp org.owasp:dependency-check-maven:check \
            -DskipTests \
            -DfailBuildOnCVSS=7 \
            -Dformats=HTML \
            -DnvdApiKey="$NVD_API_KEY"

      - name: Upload Java dependency scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-dependency-check-report
          path: backend/target/dependency-check-report.html
          if-no-files-found: ignore

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Scan npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high --json > npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit.json
          if-no-files-found: ignore

  # --------------------------------------------------
  # 4. DOCKER IMAGE BUILD AND TRIVY SECURITY SCAN
  # --------------------------------------------------
  container-security:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn -B clean package

      - name: Build backend Docker image
        run: |
          docker build \
            -t fullstack-react-springboot-backend:${{ github.sha }} \
            ./backend

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: fullstack-react-springboot-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

  # --------------------------------------------------
  # 5. UNIFIED SECURITY GATE
  # --------------------------------------------------
  security-gate:
    name: Unified Security Gate
    runs-on: ubuntu-latest
    if: always()

    needs:
      - build
      - sonarqube
      - dependency-scan
      - container-security

    steps:
      - name: Evaluate required security checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-scan.result }}
          CONTAINER_RESULT: ${{ needs.container-security.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu

          echo "Build and Test: $BUILD_RESULT"
          echo "SonarQube: $SONAR_RESULT"
          echo "Dependency scan: $DEPENDENCY_RESULT"
          echo "Container security: $CONTAINER_RESULT"

          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Security Gate FAILED: Build and Test did not succeed."
            exit 1
          fi

          if [ "$DEPENDENCY_RESULT" != "success" ]; then
            echo "Security Gate FAILED: Dependency scanning did not succeed."
            exit 1
          fi

          if [ "$CONTAINER_RESULT" != "success" ]; then
            echo "Security Gate FAILED: Container security did not succeed."
            exit 1
          fi

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$SONAR_RESULT" != "success" ]; then
            echo "Security Gate FAILED: SonarQube did not succeed."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$SONAR_RESULT" != "skipped" ] && [ "$SONAR_RESULT" != "success" ]; then
            echo "Security Gate FAILED: SonarQube did not succeed."
            exit 1
          fi

          echo "Security Gate PASSED: All required checks succeeded."
